name: ScriptLume Chatterbox Nano audition

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chatterbox-nano-audition.yml"
      - "scripts/**"
      - "prompts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-nano-${{ runner.os }}-v1

      - name: Install Chatterbox Nano dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install chatterbox-tts==0.1.7

      - name: Generate ScriptLume style samples
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/generate_nano_samples.py

      - name: Upload WAV samples
        uses: actions/upload-artifact@v4
        with:
          name: scriptlume-chatterbox-nano-samples
          path: output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
